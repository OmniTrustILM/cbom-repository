{{- if and .Values.minio.enabled (eq (.Values.minio.existingSecret | default "") "minio-secret") }}
{{- fail "minio.existingSecret must differ from minio-secret to avoid deleting the chart-managed Secret during Helm upgrade" }}
{{- end }}
{{- if and .Values.minio.enabled (not .Values.minio.existingSecret) }}
apiVersion: v1
data:
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | b64enc | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.rootPassword | b64enc | quote }}
  {{- if .Values.minio.console.enabled }}
  MINIO_BROWSER: {{ "on" | b64enc | quote }}
  MINIO_BROWSER_REDIRECT_URL: {{ .Values.minio.console.redirectUrl | b64enc | quote }}
  {{- else }}
  MINIO_BROWSER: {{ "off" | b64enc | quote }}
  {{- end }}
kind: Secret
metadata:
  name: minio-secret
{{- end }}
