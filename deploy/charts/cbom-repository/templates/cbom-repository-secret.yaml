{{- if eq (.Values.cbomRepo.existingSecret | default "") "cbom-repository-secret" }}
{{- fail "cbomRepo.existingSecret must differ from cbom-repository-secret to avoid deleting the chart-managed Secret during Helm upgrade" }}
{{- end }}
{{- if not .Values.cbomRepo.existingSecret }}
apiVersion: v1
data:
  access_key: {{ .Values.cbomRepo.accessKey | b64enc | quote }}
  secret_key: {{ .Values.cbomRepo.secretKey | b64enc | quote }}
kind: Secret
metadata:
  name: cbom-repository-secret
{{- end }}
