name: Test Chart
on:
  pull_request:
    paths:
      - 'deploy/charts/**'
      - '.github/workflows/test_chart.yaml'
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: Check
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.3.0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

      # The workflow runs only for chart or workflow changes (or by hand). When no chart
      # changed, the run was triggered by the tooling, so test every chart against it.
      - name: Detect Changed Charts
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch main --chart-dirs deploy/charts)
          echo "${changed}"

          if [[ -n "$changed" ]]; then
            echo "✅ Charts changed"
            echo "all_charts=false" >> $GITHUB_ENV
          else
            echo "ℹ️ No chart changes detected — testing all charts against the changed tooling"
            changed=$(find deploy/charts -mindepth 1 -maxdepth 1 -type d)
            echo "all_charts=true" >> $GITHUB_ENV
          fi

          echo "changed_charts<<EOF" >> $GITHUB_ENV
          echo "$changed" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Check for Development Versions (Non-release PRs)
        if: env.all_charts != 'true' && !startsWith(github.head_ref, 'release')
        env:
          changed_charts: ${{ env.changed_charts }}
        run: |
          for CHART in $changed_charts; do
            echo "🔍 Checking chart $CHART for development version"
            version=$(yq ".version" < "${CHART}/Chart.yaml")
            if [[ $version != *-develop ]]; then
              echo "❌ Chart $CHART has version '$version' but should be a development version (*-develop)"
              exit 1
            fi
          done

      - name: Check for Non-Develop Versions (Release PRs)
        if: env.all_charts != 'true' && startsWith(github.head_ref, 'release')
        env:
          changed_charts: ${{ env.changed_charts }}
        run: |
          for CHART in $changed_charts; do
            echo "🔍 Checking chart $CHART for release-ready version"
            version=$(yq ".version" < "${CHART}/Chart.yaml")
            if [[ $version == *-develop ]]; then
              echo "❌ Chart $CHART has development version '$version' in a release branch"
              exit 1
            fi
          done

      - name: Run chart-testing (lint)
        run: ct lint --target-branch main --chart-dirs deploy/charts --check-version-increment=false ${{ env.all_charts == 'true' && '--all' || '' }}

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Create testing namespace
        run: kubectl create namespace chart-testing

      - name: Run chart-testing (install)
        run: |
          ct install --namespace chart-testing --target-branch main --chart-dirs deploy/charts ${{ env.all_charts == 'true' && '--all' || '' }}
