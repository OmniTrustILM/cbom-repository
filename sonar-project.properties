sonar.projectKey=ilm_cbom-repository
sonar.organization=ilm

sonar.go.coverage.reportPaths=coverage.out
sonar.go.golangci-lint.reportPaths=golangci-lint-report.xml

sonar.test.inclusions=**/*_test.go
sonar.coverage.exclusions=**/*_test.go,cmd/cbom-repository/main.go

# Relax githubactions:S7637 ("pin dependency to a full commit SHA") only for the
# two workflows that call the OmniTrustILM org's own reusable workflows. Those
# intentionally track @main (org-managed, always-latest) rather than a pinned
# SHA. The rule stays enforced for every third-party action in every other file.
sonar.issue.ignore.multicriteria=gha_reusable_publish,gha_reusable_test
sonar.issue.ignore.multicriteria.gha_reusable_publish.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.gha_reusable_publish.resourceKey=**/publish_docker.yaml
sonar.issue.ignore.multicriteria.gha_reusable_test.ruleKey=githubactions:S7637
sonar.issue.ignore.multicriteria.gha_reusable_test.resourceKey=**/test_docker_image.yaml
